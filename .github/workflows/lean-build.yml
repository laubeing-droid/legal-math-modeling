name: Formal release gates

on:
  push:
    branches: [master, main, "ci/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test runner
        run: python -m pip install pytest

      - name: Restore elan cache
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-lean4-v4.30.0

      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0

      - name: Restore Lake packages cache
        uses: actions/cache@v4
        with:
          path: proofs/lean/juris_lean/.lake/packages
          key: ${{ runner.os }}-lake-packages-${{ hashFiles('proofs/lean/juris_lean/lakefile.lean', 'proofs/lean/juris_lean/lean-toolchain', 'proofs/lean/juris_lean/lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-packages-

      - name: Preflight changed Lean modules with Mathlib cache
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd proofs/lean/juris_lean
          lake exe cache get
          lake env lean JurisLean/CertificateChecker.lean
          lake env lean JurisLean/TranslationWitness.lean
          lake env lean JurisLean/EndToEnd.lean

      - name: Generate current-head certificate and raw logs
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          python scripts/generate_formal_release_certificate.py --run-gates --output-dir build-logs/formal-release

      - name: Independently verify certificate
        if: always()
        run: |
          python scripts/verify_formal_release_certificate.py "build-logs/formal-release/formal-release-certificate-${GITHUB_SHA}.json" --artifact-dir build-logs/formal-release

      - name: Upload immutable formal release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-release-${{ github.sha }}
          path: build-logs/formal-release/
          if-no-files-found: error
