name: Lean Authority + Formal Release Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub Actions is the sole Lean authority for this repository.
# Local machines never install or execute Lean/Elan/Lake.

on:
  pull_request:
  push:
    branches: [master, main, "ci/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "changed-module or full-release"
        required: true
        default: "changed-module"
        type: choice
        options:
          - changed-module
          - full-release
      module:
        description: "Optional single Lean module (without JurisLean. prefix)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  LEAN_DIR: proofs/lean/juris_lean
  ARTIFACT_RETENTION_DAYS: 90

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Compute Lean module matrix
        id: matrix
        run: |
          if [ "${{ inputs.mode }}" = "full-release" ] || [ "${{ github.event_name }}" = "push" ]; then
            python3 scripts/ci/changed_lean_modules.py --all --output matrix.json
          elif [ -n "${{ inputs.module }}" ]; then
            python3 -c "import json; name='${{ inputs.module }}'; open('matrix.json','w').write(json.dumps({'include':[{'module':name,'target':'JurisLean.'+name}]}) + chr(10))"
          else
            python3 scripts/ci/changed_lean_modules.py \
              --base origin/${{ github.base_ref || 'main' }} --head HEAD --output matrix.json
          fi
          {
            echo 'matrix<<EOF'
            cat matrix.json
            echo EOF
          } >> "$GITHUB_OUTPUT"

  lean-module-build:
    needs: setup-matrix
    if: ${{ needs.setup-matrix.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Restore elan cache
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-lean4-v4.30.0
      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
      - name: Restore Lake packages cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: proofs/lean/juris_lean/.lake/packages
          key: ${{ runner.os }}-lake-packages-${{ hashFiles('proofs/lean/juris_lean/lakefile.lean', 'proofs/lean/juris_lean/lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-lake-packages-
      - name: Cache Lake build directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            proofs/lean/juris_lean/.lake/build
            proofs/lean/juris_lean/.lake/packages/*/.lake/build
          key: ${{ runner.os }}-lake-build-${{ hashFiles('proofs/lean/juris_lean/lean-toolchain', 'proofs/lean/juris_lean/lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-build-
      - name: Build module ${{ matrix.module }}
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$LEAN_DIR" && set -o pipefail && lake build "${{ matrix.target }}" 2>&1 | tee "module-build-${{ matrix.module }}.log"
      - name: Upload module build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: module-build-${{ matrix.module }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ env.LEAN_DIR }}/module-build-${{ matrix.module }}.log
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  lean-full-clean-build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full-release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Restore elan cache
        id: elan-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-lean4-v4.30.0
      - name: Install elan
        if: steps.elan-cache.outputs.cache-hit != 'true'
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
      - name: Restore Lake packages cache (download only)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: proofs/lean/juris_lean/.lake/packages
          key: ${{ runner.os }}-lake-packages-${{ hashFiles('proofs/lean/juris_lean/lakefile.lean', 'proofs/lean/juris_lean/lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-lake-packages-
      - name: Lake clean + build (root, from zero, no olean reuse)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$LEAN_DIR" && set -o pipefail && lake clean && lake build 2>&1 | tee ../../../lake-clean-build.log
          df -h . || true
      - name: Axiom audit
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd "$LEAN_DIR" && lake build JurisLean.AxiomAudit && lake env lean JurisLean/AxiomAudit.lean > ../../../axiom-audit.raw.txt 2>&1
      - name: Upload clean build + axiom audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-full-build-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            lake-clean-build.log
            axiom-audit.raw.txt
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  python-gates:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full-release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Collection manifest
        run: python -m pytest tests/ --collect-only -q > pytest-collection.txt
      - name: Full test suite
        run: set -o pipefail && python -m pytest tests/ -q -ra 2>&1 | tee pytest-full.log
      - name: Lean guard scan
        run: set -o pipefail && python scripts/scan_lean_guards.py proofs/lean/juris_lean/JurisLean 2>&1 | tee lean-guard-report.json
      - name: Controlled checker-input mutation gate
        run: python scripts/run_mutation_property_gate.py --repo-root . --output mutation-property-report.json
      - name: Upload Python gate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-gates-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            pytest-collection.txt
            pytest-full.log
            lean-guard-report.json
            mutation-property-report.json
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  runtime-refinement:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'full-release' }}
    uses: laubeing-droid/juris-calculus/.github/workflows/runtime-refinement.yml@c79e03b8d0cfed85c43cc013bf8a0b50326bc858
    with:
      lmm_repository: ${{ github.repository }}
      lmm_ref: ${{ github.sha }}
      runtime_ref: c79e03b8d0cfed85c43cc013bf8a0b50326bc858
    permissions:
      contents: read

  release-certificate:
    needs: [lean-full-clean-build, python-gates, runtime-refinement]
    if: >-
      ${{ (github.event_name != 'workflow_dispatch' || inputs.mode == 'full-release') && needs.lean-full-clean-build.result == 'success' && needs.python-gates.result == 'success' && needs.runtime-refinement.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Download upstream artifacts for verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ci-evidence
      - name: Flatten evidence artifacts
        run: |
          mkdir -p ci-evidence-flat
          find ci-evidence -type f -exec cp -f {} ci-evidence-flat/ \;
      - name: Build run identity
        run: |
          python scripts/ci/build_run_identity.py --repo-root . --artifact-dir ci-evidence-flat --output ci-run-identity.json
          cp -f ci-run-identity.json ci-evidence-flat/ci-run-identity.json
      - name: Generate formal release certificate
        run: python scripts/generate_formal_release_certificate.py --repo-root . --ci-evidence-dir ci-evidence-flat --output formal-release-certificate.json
      - name: Independent verifier
        run: python scripts/verify_formal_release_certificate.py --certificate formal-release-certificate.json --repo-root . --ci-evidence-dir ci-evidence-flat --output independent-verifier-report.json
      - name: Allowed/forbidden claim audit
        run: |
          python - <<'PY' | tee claim-audit-report.json
          import json, pathlib, re, sys
          forbidden = [
              "entire juris-calculus has been formally verified",
              "Python implementation has been fully refinement-proved",
              "omits no edges or creates no spurious attacks",
              "graph similarity is a metric",
              "differential privacy guarantees are established",
          ]
          hits = []
          for path in pathlib.Path("docs").rglob("*.md"):
              text = path.read_text(encoding="utf-8", errors="ignore").lower()
              for phrase in forbidden:
                  if phrase in text:
                      hits.append({"file": str(path), "phrase": phrase})
          print(json.dumps({"forbidden_claim_hits": hits}, indent=2))
          sys.exit(1 if hits else 0)
          PY
      - name: Upload release certificate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-certificate-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            ci-run-identity.json
            formal-release-certificate.json
            independent-verifier-report.json
            claim-audit-report.json
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  final-gate:
    needs: [lean-full-clean-build, python-gates, runtime-refinement, release-certificate]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.mode == 'full-release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download release certificate artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-certificate-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: release-certificate
      - name: Fail closed unless every upstream job succeeded
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          python3 - <<'PY'
          import json, sys
          needs = json.load(open("needs.json"))
          blocked = [name for name, job in needs.items() if job.get("result") != "success"]
          if blocked:
              print(f"release blocked by: {blocked}")
              sys.exit(1)
          certificate = json.load(open("release-certificate/formal-release-certificate.json"))
          verifier = json.load(open("release-certificate/independent-verifier-report.json"))
          expected = {
              "certificate_status": "RELEASE_PASS_PENDING_INDEPENDENT_VERIFICATION",
              "verifier_verdict": "VERIFIED_PENDING_RELEASE_GATE",
              "subject_sha": "${{ github.sha }}",
          }
          actual = {
              "certificate_status": certificate.get("status"),
              "verifier_verdict": verifier.get("verdict"),
              "subject_sha": certificate.get("subject", {}).get("sha"),
          }
          if actual != expected or verifier.get("error_codes"):
              print(json.dumps({"expected": expected, "actual": actual, "errors": verifier.get("error_codes")}, indent=2))
              sys.exit(1)
          print(json.dumps(actual, indent=2))
          PY
