name: ULM Consolidated Reference and Retained Proof Seeds

on:
  pull_request:
    paths:
      - 'tools/unified_math_v2/**'
      - 'tools/business_relations/**'
      - 'tools/ulm_consolidation/**'
      - 'proofs/lean/juris_lean/**'
      - 'docs/unified-v2.1/**'
      - 'docs/ulm-consolidated/**'
      - '.github/workflows/unified-math-v2-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ulm-consolidated-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  JC_SHA: 8dac071bda42c4db609738a7505b6893c32afbe1
  ELAN_INSTALLER_SHA: 0e36a07b9bbcc5381fa6250df109f9a4f94d7bac

jobs:
  python-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run consolidated reference, actual two-file readback and preservation checks
        run: |
          set -euo pipefail
          # unittest discovers tools/unified_math_v2/tests, and eleven of those
          # modules call pytest.raises. The runner image does not ship pytest.
          python -m pip install pytest
          python -B tools/ulm_consolidation/scripts/run_all.py --output work/consolidated-python
          python -B tools/ulm_consolidation/scripts/run_root.py --output work/consolidated-python/root
          python -B tools/ulm_consolidation/scripts/ci_receipt.py --report work/consolidated-python/consolidated-python.json --output work/consolidated-python/consolidated-python.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consolidated-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/consolidated-python/
          if-no-files-found: error
          retention-days: 90

  # One ULM gate. These package legs run in parallel under this single job id.
  # reference-gate depends on lean-seeds once and is success only when every
  # leg succeeds. Cache key = runner OS + pinned toolchain version + pinned
  # mathlib commit + leg id. github.run_id is not part of it.
  # Seams, Genealogy, and External stay out of this gate: seed coverage is the
  # consolidated and business-root audits, and those packages are not part of
  # the six-leg list.
  lean-seeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      # A failed leg must not cancel the other ones' evidence uploads. The job
      # result is still failure unless every leg succeeds.
      fail-fast: false
      matrix:
        include:
          - leg: consolidated
            lake_target: JurisLean.Consolidated.All
            build_kind: module
            audit: seeds
          - leg: business-root
            lake_target: JurisLean.BusinessRoot.All
            build_kind: module
            audit: root
          - leg: fullmath
            lake_target: JurisLean.FullMath.All
            build_kind: module
            audit: build
          - leg: unified-v2
            lake_target: JurisLean.UnifiedV2.All
            build_kind: module
            audit: build
          - leg: candidates
            lake_target: JurisLean.Candidates.Final20261021.CIAll
            build_kind: module
            audit: build
          - leg: mandate
            lake_target: JurisLean.Mandate
            build_kind: directory
            audit: build
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify checked-in toolchain and mathlib manifest
        run: python tools/unified_math_v2/scripts/verify_pins.py --repo-root .
      - name: Fingerprint pinned Lean toolchain and mathlib commit
        id: lean-cache-key
        env:
          LEAN_SEEDS_TARGET: ${{ matrix.leg }}
          LEAN_SEEDS_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          toolchain=$(tr -d '[:space:]' < proofs/lean/juris_lean/lean-toolchain)
          version=${toolchain##*:}
          case "$version" in
            v[0-9]*) ;;
            *) echo "refusing cache key: toolchain version missing in ${toolchain}" >&2; exit 1 ;;
          esac
          case "$version" in
            *[!A-Za-z0-9._-]*) echo "refusing cache key: illegal toolchain version ${version}" >&2; exit 1 ;;
          esac
          mathlib=$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("proofs/lean/juris_lean/lake-manifest.json").read_text(encoding="utf-8"))
          hits = [p.get("rev") for p in manifest.get("packages", []) if p.get("name") == "mathlib"]
          if len(hits) != 1 or not isinstance(hits[0], str):
              raise SystemExit("mathlib pin missing or ambiguous")
          rev = hits[0]
          if len(rev) != 40 or any(c not in "0123456789abcdef" for c in rev):
              raise SystemExit("mathlib rev is not a full lowercase commit")
          print(rev)
          PY
          )
          case "$LEAN_SEEDS_TARGET" in
            consolidated|business-root|fullmath|unified-v2|candidates|mandate) ;;
            *) echo "refusing cache key: unknown lean-seeds target ${LEAN_SEEDS_TARGET}" >&2; exit 1 ;;
          esac
          key="lean-seeds-${LEAN_SEEDS_RUNNER_OS}-${version}-${mathlib}-${LEAN_SEEDS_TARGET}"
          case "$key" in
            *[!A-Za-z0-9._-]*) echo "refusing cache key: illegal characters in ${key}" >&2; exit 1 ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "mathlib=${mathlib}" >> "$GITHUB_OUTPUT"
          echo "cache_key=${key}" >> "$GITHUB_OUTPUT"
          echo "lean-seeds cache key ${key}"
      - name: Install pinned-script Elan with frozen Lean toolchain (CI only)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL "https://raw.githubusercontent.com/leanprover/elan/${ELAN_INSTALLER_SHA}/elan-init.sh" -o /tmp/ulm-elan-init.sh
          sh /tmp/ulm-elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lean build cache
        id: lean-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: proofs/lean/juris_lean/.lake
          key: ${{ steps.lean-cache-key.outputs.cache_key }}
          restore-keys: |
            lean-seeds-${{ runner.os }}-${{ steps.lean-cache-key.outputs.version }}-${{ steps.lean-cache-key.outputs.mathlib }}-
            lean-seeds-${{ runner.os }}-${{ steps.lean-cache-key.outputs.version }}-
      - name: Fetch pinned mathlib oleans, build this leg, inspect when this leg owns an audit
        env:
          LEAN_SEEDS_TARGET: ${{ matrix.leg }}
          LAKE_TARGET: ${{ matrix.lake_target }}
          BUILD_KIND: ${{ matrix.build_kind }}
          LEAN_AUDIT: ${{ matrix.audit }}
        run: |
          set -euo pipefail
          mkdir -p work/consolidated-lean
          cd proofs/lean/juris_lean
          elan --version > ../../../work/consolidated-lean/tool-versions.log
          lean --version >> ../../../work/consolidated-lean/tool-versions.log
          # Same fetch the Authority workflow uses for this pin. Without it a
          # cache miss compiles mathlib from source and the extra legs do not
          # shorten the wall clock.
          lake exe cache get! 2>&1 | tee ../../../work/consolidated-lean/mathlib-cloud-cache.log
          case "$BUILD_KIND" in
            module)
              if [ -z "$LAKE_TARGET" ]; then
                echo "refusing leg ${LEAN_SEEDS_TARGET}: empty lake target" >&2
                exit 1
              fi
              lake build "$LAKE_TARGET" 2>&1 | tee ../../../work/consolidated-lean/build.log
              ;;
            directory)
              dir=${LAKE_TARGET//./\/}
              if [ ! -d "$dir" ]; then
                echo "refusing leg ${LEAN_SEEDS_TARGET}: missing ${dir}" >&2
                exit 1
              fi
              targets=()
              while IFS= read -r rel; do
                mod=${rel%.lean}
                mod=${mod//\//.}
                targets+=("${LAKE_TARGET}.${mod}")
              done < <(find "$dir" -type f -name '*.lean' -printf '%P\n' | sort)
              if [ "${#targets[@]}" -lt 20 ]; then
                echo "refusing leg ${LEAN_SEEDS_TARGET}: only ${#targets[@]} modules in ${dir}" >&2
                exit 1
              fi
              printf '%s\n' "${targets[@]}" | tee ../../../work/consolidated-lean/package-targets.txt
              lake build "${targets[@]}" 2>&1 | tee ../../../work/consolidated-lean/build.log
              ;;
            *)
              echo "unknown lean-seeds build kind: ${BUILD_KIND}" >&2
              exit 1
              ;;
          esac
          case "$LEAN_AUDIT" in
            seeds)
              lake env lean JurisLean/Consolidated/Audit.lean > ../../../work/consolidated-lean/environment.log 2>&1
              ;;
            root)
              lake env lean JurisLean/BusinessRoot/RootAudit.lean > ../../../work/consolidated-lean/root-environment.log 2>&1
              ;;
            build)
              ;;
            *)
              echo "unknown lean-seeds audit: ${LEAN_AUDIT}" >&2
              exit 1
              ;;
          esac
          cd ../../..
          python tools/unified_math_v2/scripts/verify_pins.py --repo-root .
          case "$LEAN_AUDIT" in
            seeds)
              python tools/ulm_consolidation/scripts/audit_compiled.py --log work/consolidated-lean/environment.log --expected tools/ulm_consolidation/plans/LEAN_SEEDS_84.json --output work/consolidated-lean/consolidated-lean.json
              python tools/ulm_consolidation/scripts/ci_receipt.py --report work/consolidated-lean/consolidated-lean.json --output work/consolidated-lean/consolidated-lean.json
              ;;
            root)
              python tools/ulm_consolidation/scripts/audit_root_compiled.py --log work/consolidated-lean/root-environment.log --output work/consolidated-lean/root-compiled.json
              python tools/ulm_consolidation/scripts/ci_receipt.py --report work/consolidated-lean/root-compiled.json --output work/consolidated-lean/root-compiled.json
              ;;
            build)
              ;;
            *)
              echo "unknown lean-seeds audit: ${LEAN_AUDIT}" >&2
              exit 1
              ;;
          esac
          python - <<'PY'
          import json, os
          from pathlib import Path
          leg = os.environ["LEAN_SEEDS_TARGET"]
          path = Path("work/consolidated-lean") / f"leg-{leg}.json"
          path.write_text(json.dumps({
              "status": "PASS",
              "scope": "LEAN_SEEDS_MATRIX_LEG",
              "leg": leg,
              "lake_target": os.environ["LAKE_TARGET"],
              "audit": os.environ["LEAN_AUDIT"],
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          python tools/ulm_consolidation/scripts/ci_receipt.py --report "work/consolidated-lean/leg-${LEAN_SEEDS_TARGET}.json" --output "work/consolidated-lean/leg-${LEAN_SEEDS_TARGET}.json"
      - name: Save Lean build cache
        # A stable key must not record a failed tree: GitHub cannot replace an
        # existing entry. Skip the write on an exact hit or a failed build.
        if: success() && steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: proofs/lean/juris_lean/.lake
          key: ${{ steps.lean-cache-key.outputs.cache_key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consolidated-lean-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/consolidated-lean/
          if-no-files-found: error
          retention-days: 90

  existing-jc-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: laubeing-droid/juris-calculus
          ref: 8dac071bda42c4db609738a7505b6893c32afbe1
          path: external/jc
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen JC runtime and record resolved dependency versions
        run: |
          set -euo pipefail
          mkdir -p work/consolidated-jc
          python -m pip install ./external/jc
          python -m pip freeze > work/consolidated-jc/installed-dependencies.txt
      - name: Call actual local public API with engineering-only material
        run: |
          set -euo pipefail
          python tools/unified_math_v2/scripts/jc_local_smoke.py --jc-root external/jc --expected-jc-sha "$JC_SHA" --output work/consolidated-jc/consolidated-jc.json
          python tools/ulm_consolidation/scripts/ci_receipt.py --report work/consolidated-jc/consolidated-jc.json --output work/consolidated-jc/consolidated-jc.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consolidated-jc-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/consolidated-jc/
          if-no-files-found: error
          retention-days: 90

  reference-gate:
    needs: [python-reference, lean-seeds, existing-jc-transport]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require all jobs succeeded; skipped/cancelled is not PASS
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          failures={k:v['result'] for k,v in json.loads(os.environ['NEEDS_JSON']).items() if v['result']!='success'}
          if failures: raise SystemExit(str(failures))
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: consolidated-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/upstream
          merge-multiple: false
      - name: Require every lean-seeds leg and the retained seed audits
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("work/upstream")
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          # Same six legs as lean-seeds.matrix. A missing leg is not ULM success.
          required_legs = ("consolidated", "business-root", "fullmath", "unified-v2", "candidates", "mandate")
          names = [f"leg-{leg}.json" for leg in required_legs] + ["consolidated-lean.json", "root-compiled.json"]
          for name in names:
              matches = list(root.rglob(name))
              if len(matches) != 1:
                  raise SystemExit(f"Missing/ambiguous {name}: {len(matches)}")
              report = json.loads(matches[0].read_text(encoding="utf-8"))
              binding = report.get("ci_binding") or {}
              if report.get("status") != "PASS" or str(binding.get("run_id")) != run_id or str(binding.get("attempt")) != attempt:
                  raise SystemExit(f"{name} is not a PASS receipt for this run")
          PY
      - name: Aggregate exact subjects without flattening or silent overwrite
        run: python tools/ulm_consolidation/scripts/ci_receipt.py --aggregate work/upstream --output work/consolidated-reference-gate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consolidated-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/consolidated-reference-gate.json
          if-no-files-found: error
          retention-days: 90
